<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic de croissance — 3 minutes</title>
<meta name="description" content="Obtenez votre plan de croissance personnalisé en 3 minutes. Diagnostic en 4 piliers pour dirigeants de TPE/PME.">
<style>
  :root{
    --paper:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --ink-soft:#57534c;
    --line:#e5e0d6; --line-strong:#d6cfc0; --navy:#1f3a5f; --navy-soft:#2f4d78;
    --accent:#e0483d; --accent-dark:#c23a30;
    --green:#2f6d4f; --amber:#9a6b12; --red:#a23a2e; --chip:#efeae0;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased}

  /* En-tete + progression */
  .top{background:#111;color:#fff;text-align:center;padding:14px}
  .top b{font-weight:800;letter-spacing:.3px;font-size:16px}
  .progwrap{max-width:520px;margin:22px auto 0;padding:0 20px}
  .proglabel{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .progbar{height:8px;background:#f0d9d6;border-radius:20px;overflow:hidden}
  .progfill{height:100%;background:var(--accent);width:0;border-radius:20px;transition:width .4s ease}

  /* Zone principale */
  .stage{max-width:720px;margin:0 auto;padding:36px 20px 70px;min-height:60vh;
    display:flex;flex-direction:column;justify-content:center}
  .back{background:none;border:0;color:var(--ink-soft);font:inherit;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;align-self:center}
  .back:hover{color:var(--ink)}
  .q{font-size:26px;font-weight:700;text-align:center;line-height:1.25;margin:0 0 8px}
  @media (max-width:600px){.q{font-size:21px}}
  .qsub{font-size:15px;color:var(--ink-soft);text-align:center;margin:0 0 24px}
  .hint{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 0 18px;font-style:italic}

  /* Options choix */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 auto;max-width:640px;width:100%}
  @media (max-width:600px){.opts{grid-template-columns:1fr}}
  .opts.single-col{grid-template-columns:1fr;max-width:520px}
  .opt{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:15.5px;font-weight:600;
    color:#fff;background:var(--accent);border:2px solid var(--accent);border-radius:12px;padding:18px 18px;
    cursor:pointer;transition:transform .05s,filter .15s;line-height:1.3}
  .opt:hover{filter:brightness(1.05)} .opt:active{transform:translateY(1px)}
  .opt.sel{background:var(--accent-dark);border-color:#111;box-shadow:0 0 0 3px rgba(224,72,61,.25)}
  .opt .em{font-size:18px;flex:none}

  /* Echelle 1-5 */
  .scale{display:flex;justify-content:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  .sc{width:56px;height:56px;border-radius:12px;border:2px solid var(--line-strong);background:var(--card);
    font:inherit;font-size:19px;font-weight:700;color:var(--navy);cursor:pointer;transition:all .12s}
  .sc:hover{border-color:var(--accent);color:var(--accent)}
  .sc.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .scends{display:flex;justify-content:space-between;max-width:360px;margin:0 auto;font-size:12.5px;color:var(--ink-soft)}

  /* Ecrans info / intro */
  .info-t{font-size:24px;font-weight:700;text-align:center;line-height:1.3;margin:0 0 14px}
  @media (max-width:600px){.info-t{font-size:20px}}
  .info-p{font-size:16px;color:var(--ink-soft);text-align:center;margin:0 auto 10px;max-width:52ch}

  .cta{display:block;margin:26px auto 0;font:inherit;font-size:16px;font-weight:700;padding:15px 30px;border:0;
    border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;transition:filter .15s}
  .cta:hover{filter:brightness(1.06)}
  .cta.navy{background:var(--navy)}
  .cta[disabled]{opacity:.45;cursor:not-allowed}

  /* Formulaire capture */
  .capture{max-width:460px;margin:0 auto;width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(31,58,95,.10)}
  .capture h2{font-size:20px;text-align:center;margin:0 0 6px}
  .capture .sub{font-size:14px;color:var(--ink-soft);text-align:center;margin:0 0 18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.row2{grid-template-columns:1fr}}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
  .fld input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line-strong);
    border-radius:9px;background:var(--paper);color:var(--ink)}
  .fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,72,61,.14)}
  .consent{display:flex;gap:8px;font-size:12px;color:var(--ink-soft);margin:6px 0 14px}
  .consent input{margin-top:2px;width:15px;height:15px;flex:none;accent-color:var(--accent)}
  .cmsg{font-size:13px;text-align:center;margin-top:10px;min-height:18px}
  .cmsg.err{color:var(--red)}
  .hp{position:absolute;left:-9999px}

  /* Resultats */
  .results{max-width:760px;margin:0 auto;width:100%}
  .res-hero{text-align:center;margin-bottom:26px}
  .res-hero h1{font-size:26px;margin:0 0 8px}
  .res-hero p{color:var(--ink-soft);margin:0}
  .globe{font-size:44px;font-weight:800;color:var(--accent);margin:8px 0}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px;margin:0 0 16px;
    box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .pill-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .pill-h b{font-size:17px}
  .pill-pct{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .pill-bar{height:9px;background:var(--chip);border-radius:20px;overflow:hidden;margin:8px 0 12px}
  .pill-bar span{display:block;height:100%;background:var(--accent);border-radius:20px}
  .pill p{font-size:14px;color:var(--ink-soft);margin:0 0 10px}
  .pill ul{margin:0;padding-left:18px;font-size:14px}
  .pill li{margin-bottom:6px}
  .pill-right{display:flex;align-items:center;gap:10px}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
  .pill-actlab{font-weight:700;color:var(--ink);margin:12px 0 6px;font-size:13.5px}
  .synth{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:12px;padding:20px 22px;margin:0 0 10px}
  .synth h3{margin:0 0 12px;font-size:19px;line-height:1.3}
  .synth p{font-size:14.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.6}
  .synth p:last-child{margin-bottom:0}
  .sectitle{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);
    text-align:center;margin:34px 0 6px}
  .res-final{background:var(--navy);color:#fff;border-radius:16px;padding:30px 24px;text-align:center;margin-top:30px}
  .res-final h2{margin:0 0 10px;font-size:22px}
  .res-final p{margin:0 auto 6px;max-width:48ch;opacity:.9;font-size:15px}
  .res-final .cta{background:#fff;color:var(--navy)}
  .proof{text-align:center;color:var(--ink-soft);font-size:13px;margin:22px 0}
  .edit{background:#fff6d6;border:1px dashed #d8b24a;color:#7a5b12;border-radius:10px;padding:10px 14px;
    font-size:12.5px;margin:14px 0;text-align:center}

  .foot{text-align:center;font-size:11px;color:var(--ink-soft);padding:26px 20px;max-width:760px;margin:0 auto;line-height:1.6}
  .hide{display:none}
</style>
</head>

    var map={"Acquisition":"Acquisition","Délégation":"Délégation","Structuration":"Process","Rentabilité":"Pilotage"};
    var out=[]; (answers.situations||[]).forEach(function(l){
      Object.keys(map).forEach(function(k){ if(l.indexOf(k)===0) out.push(map[k]); });
    }); return out;
  }
  function ambition(){ var o=answers.objectif||""; if(o.indexOf("doubler")>-1||o.indexOf("multiplier")>-1) return "haute"; if(o.indexOf("20")>-1) return "moyenne"; return "basse"; }
  function heavyLoad(){ var h=answers.heures||""; return h.indexOf("51")>-1||h.indexOf("Plus de 60")>-1; }
  function strained(){ var r=answers.ressenti||""; return r.indexOf("pas du tout")>-1||r.indexOf("compliqué")>-1; }

  function buildSynthesis(){
    var arr = PILLARS.map(function(p){return {p:p,s:pillarPct(p)};}).sort(function(a,b){return a.s-b.s;});
    var w=arr[0], w2=arr[1];
    var twoWeak = (w2.s - w.s)<=8 && w2.s<=55;
    var head = twoWeak ? ("Deux piliers vous freinent en priorité : "+w.p+" et "+w2.p+".")
                       : ("Votre principal point de blocage aujourd'hui : "+w.p+".");
    var paras=[];
    paras.push(MECH[w.p]);
    if(twoWeak) paras.push("Et ce n'est pas isolé : votre "+w2.p+" est tout aussi fragile ("+w2.s+" %). Les deux s'entretiennent mutuellement, ce qui amplifie le blocage.");
    var sp=situationsPillars();
    if(sp.indexOf(w.p)>-1) paras.push("Vous l'aviez d'ailleurs pressenti : vous l'avez coché dès le début du diagnostic. Vos réponses ne font que le confirmer, chiffres à l'appui.");
    var amb=ambition(), obj=answers.objectif||"";
    if(amb==="haute") paras.push("Vous visez à "+(obj.indexOf("multiplier")>-1?"multiplier votre chiffre par 3 ou plus":"doubler votre chiffre")+" en 2026. Soyons directs : avec votre "+w.p+" à "+w.s+" %, cet objectif n'est pas atteignable en l'état. Ce n'est pas une question de travailler plus, mais de débloquer ce pilier en premier, sinon l'essentiel de votre énergie continuera de fuir par là.");
    else if(amb==="moyenne") paras.push("Votre objectif de croissance de 20 à 50 % est réaliste, à condition de renforcer d'abord votre "+w.p+" : c'est le maillon qui limite aujourd'hui votre progression.");
    else paras.push("Vous souhaitez d'abord stabiliser, et c'est sain. Mais c'est justement votre "+w.p+" qui fragilise cette stabilité : c'est par là qu'il faut commencer.");
    if(heavyLoad()||strained()) paras.push("Vous travaillez déjà "+(answers.heures||"beaucoup")+" par semaine et le rythme pèse. Le problème n'est donc pas votre implication : c'est qu'elle n'est pas démultipliée. Renforcer ce pilier vous rendra d'abord des heures et de la sérénité, avant même du chiffre.");
    else paras.push("La bonne nouvelle : un point faible ciblé et corrigé en priorité débloque souvent les autres. Concentrez vos 90 prochains jours ici, plutôt que de vous disperser.");
    return { head:head, paras:paras, order:arr.map(function(x){return x.p;}) };
  }
  // =======================================================

  var idx = 0;
  var answers = {};
  var stage = document.getElementById('stage');

  function setProgress(){
    var p = Math.round(idx / (STEPS.length - 1) * 100);
    document.getElementById('pct').textContent = p;
    document.getElementById('progfill').style.width = p + '%';
  }

  function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
  function next(){ if(idx < STEPS.length-1){ idx++; render(); } }
  function back(){ if(idx > 0){ idx--; render(); } }

  function addBack(){
    if(idx===0) return;
    var b = el('button','back','← Retour'); b.onclick = back; stage.appendChild(b);
  }

  function render(){
    var s = STEPS[idx];
    stage.innerHTML = '';
    setProgress();
    window.scrollTo(0,0);
    document.getElementById('foot').classList.toggle('hide', s.type==='results');

    if(s.type==='intro' || s.type==='info'){
      if(s.type==='info') addBack();
      stage.appendChild(el('h1', s.type==='intro'?'q':'info-t', s.title));
      if(s.sub) stage.appendChild(el('p','qsub', s.sub));
      if(s.p) s.p.forEach(function(t){ stage.appendChild(el('p','info-p', t)); });
      var c = el('button','cta', s.cta); c.onclick = next; stage.appendChild(c);
      return;
    }

    if(s.type==='choice'){
      addBack();
      stage.appendChild(el('h2','q', s.q));
      if(s.hint) stage.appendChild(el('p','hint', s.hint));
      var grid = el('div','opts' + (s.options.length>4||!s.multi&&s.options.some(function(o){return o.label.length>40;})?' single-col':''));
      if(s.options.length>4 || longOpts(s.options)) grid.classList.add('single-col');
      var current = answers[s.key] || (s.multi?[]:null);
      s.options.forEach(function(o){
        var b = el('button','opt', (o.em?'<span class="em">'+o.em+'</span>':'') + '<span>'+o.label+'</span>');
        if(s.multi ? current.indexOf(o.label)>-1 : current===o.label) b.classList.add('sel');
        b.onclick = function(){
          if(s.multi){
            var arr = answers[s.key] || [];
            var i = arr.indexOf(o.label);
            if(i>-1) arr.splice(i,1); else arr.push(o.label);
            answers[s.key]=arr; render();
          } else {
            answers[s.key]=o.label; next();
          }
        };
        grid.appendChild(b);
      });
      stage.appendChild(grid);
      if(s.multi){
        var c = el('button','cta', 'Continuer');
        c.disabled = !(answers[s.key] && answers[s.key].length);
        c.onclick = next; stage.appendChild(c);
      }
      return;
    }

    if(s.type==='scale'){
      addBack();
      stage.appendChild(el('p','hint','À quel point cette phrase vous parle ?'));
      stage.appendChild(el('h2','q', s.q));
      var sc = el('div','scale');
      for(var n=1;n<=5;n++){(function(n){
        var b = el('button','sc', n);
        if(answers[s.key]===n) b.classList.add('sel');
        b.onclick = function(){ answers[s.key]=n; next(); };
        sc.appendChild(b);
      })(n);}
      stage.appendChild(sc);
      var ends = el('div','scends'); ends.appendChild(el('span',null,'Pas du tout')); ends.appendChild(el('span',null,'Tout à fait'));
      stage.appendChild(ends);
      return;
    }

    if(s.type==='capture'){ renderCapture(); return; }
    if(s.type==='results'){ renderResults(); return; }
  }

  function longOpts(opts){ return opts.some(function(o){ return o.label.length>44; }); }

  function renderCapture(){
    addBack();
    var pct = overallPct();
    stage.appendChild(el('h2','q','Votre entreprise est à '+pct+'% de son plein potentiel.'));
    stage.appendChild(el('p','qsub','Entrez vos coordonnées pour recevoir votre plan d\'action détaillé.'));
    var box = el('div','capture');
    box.innerHTML =
      '<form id="capForm">'+
      '<input type="text" name="website" class="hp" tabindex="-1" autocomplete="off">'+
      '<div class="row2">'+
        '<div class="fld"><label>Prénom</label><input name="prenom" type="text" required></div>'+
        '<div class="fld"><label>Nom</label><input name="nom" type="text" required></div>'+
      '</div>'+
      '<div class="fld"><label>Email</label><input name="email" type="email" required></div>'+
      '<div class="fld"><label>Téléphone portable</label><input name="tel" type="tel" inputmode="tel" placeholder="06 12 34 56 78" required></div>'+
      '<label class="consent"><input type="checkbox" id="rgpd" required><span>J\'accepte d\'être recontacté au sujet de mon diagnostic.</span></label>'+
      '<button class="cta" type="submit" style="width:100%" id="capBtn">Obtenir mon plan d\'action personnalisé</button>'+
      '<div class="cmsg" id="capMsg"></div>'+
      '</form>';
    stage.appendChild(box);

    var f = box.querySelector('#capForm');
    f.addEventListener('submit', function(e){
      e.preventDefault();
      if(f.website.value){ next(); return; } // honeypot
      if(!box.querySelector('#rgpd').checked){ setCapMsg('Merci de cocher la case pour continuer.'); return; }
      answers.prenom=f.prenom.value; answers.nom=f.nom.value; answers.email=f.email.value; answers.telephone=f.tel.value;
      var btn = box.querySelector('#capBtn'); btn.disabled=true; btn.textContent='Envoi...';
      sendLead(function(){ next(); });
    });
    function setCapMsg(t){ var m=box.querySelector('#capMsg'); m.textContent=t; m.className='cmsg err'; }
  }

  function pillarPct(pillar){
    var keys = STEPS.filter(function(s){return s.type==='scale' && s.pillar===pillar;}).map(function(s){return s.key;});
    var vals = keys.map(function(k){return answers[k];}).filter(function(v){return typeof v==='number';});
    if(!vals.length) return 0;
    var avg = vals.reduce(function(a,b){return a+b;},0)/vals.length;
    return Math.round(avg/5*100);
  }
  function overallPct(){
    var arr = PILLARS.map(pillarPct);
    return Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length);
  }

  function sendLead(done){
    var p = new URLSearchParams();
    p.append('source','diagnostic-lab0');
    p.append('page', location.href);
    Object.keys(answers).forEach(function(k){
      var v = answers[k]; p.append(k, Array.isArray(v)? v.join(' | ') : v);
    });
    PILLARS.forEach(function(pl){ p.append('score_'+pl.toLowerCase().replace('é','e'), pillarPct(pl)); });
    p.append('score_global', overallPct());
    var finished=false; var go=function(){ if(!finished){ finished=true; done(); } };
    fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:p.toString(),keepalive:true}).then(go).catch(go);
    setTimeout(go, 2500); // securite : on n'attend jamais indefiniment
  }

  function renderResults(){
    var g = overallPct();
    var syn = buildSynthesis();
    var r = el('div','results');

    var hero = el('div','res-hero');
    hero.appendChild(el('h1', null, "Félicitations "+ (answers.prenom||'') +" !"));
    hero.appendChild(el('p', null, "Voici votre diagnostic sur mesure et votre plan d'action."));
    hero.appendChild(el('div','globe', g+'%'));
    hero.appendChild(el('p', null, "Niveau de maturité global de votre entreprise."));
    r.appendChild(hero);

    // Synthese sur mesure
    var syb = el('div','synth');
    syb.appendChild(el('h3', null, syn.head));
    syn.paras.forEach(function(t){ syb.appendChild(el('p', null, t)); });
    r.appendChild(syb);

    // Piliers, du plus faible au plus fort (le point faible est mis en avant)
    r.appendChild(el('div','sectitle', "Votre diagnostic en 4 piliers"));
    syn.order.forEach(function(pl){
      var pct = pillarPct(pl);
      var t = tierOf(pct);
      var ti = TIER[t];
      var plan = PLAN[pl];
      var c = el('div','pill');
      var h = el('div','pill-h');
      h.appendChild(el('b', null, pl));
      var right = el('div','pill-right');
      var badge = el('span','badge', ti.label); badge.style.background = ti.color;
      right.appendChild(badge);
      right.appendChild(el('span','pill-pct', pct+'%'));
      h.appendChild(right);
      c.appendChild(h);
      var bar = el('div','pill-bar'); var span=el('span'); span.style.width=pct+'%'; span.style.background=ti.color; bar.appendChild(span); c.appendChild(bar);
      c.appendChild(el('p', null, DIAG[pl][t]));
      c.appendChild(el('p','pill-actlab', (t==='solide'||t==='progression') ? "Pour aller plus loin :" : "À mettre en place en priorité :"));
      var ul = el('ul'); plan.actions.forEach(function(a){ ul.appendChild(el('li', null, a)); }); c.appendChild(ul);
      r.appendChild(c);
    });

    r.appendChild(el('div','edit', "Zone à personnaliser : ajoutez vos vrais chiffres et vos vrais témoignages clients avant de lancer la pub."));
    r.appendChild(el('div','proof', "Plus de [XX] dirigeants accompagnés par Lab0."));

    var fin = el('div','res-final');
    fin.appendChild(el('h2', null, "Prêt à transformer ce diagnostic en résultats concrets ?"));
    fin.appendChild(el('p', null, "Réservez votre appel stratégique offert avec un expert Lab0. Vous repartez avec vos priorités claires."));
    var cta = el('a','cta', "Réserver mon appel stratégique offert");
    cta.href = CALENDAR_URL; cta.target='_blank'; cta.rel='noopener'; cta.style.textDecoration='none';
    fin.appendChild(cta);
    r.appendChild(fin);

    stage.appendChild(r);
  }

  render();
})();
</script>
